s, power, cost and reliability values are catalog values. Where marked/understood as gameplay estimates, they are balancing estimates rather than exact procurement specifications.", "Power consumption and power generation are separate fields. A component may have 0 W in one field when it does not consume or generate electrical power.", "Do not interpret this tree as a strict hardware dependency graph. It is a chronological technology progression display grouped into category lanes."]};

// Expanded in-game descriptions (shown only here in the Tech Tree, when a component is selected).
// d = detailed description, m = mission association, a = flag for generic / later-era component classes.
window.EXPANDED = {"b_sph":{"d":"A compact, sealed pressure vessel that forms the spacecraft's primary structure. The spherical shell distributes internal pressure relatively evenly and offers a simple way to protect basic electronics and instruments, but its curved interior leaves little usable mounting area and makes expansion difficult. The Sputnik-era design is best understood as an early satellite bus concept rather than a modern modular platform."},"b_cyl":{"d":"A narrow cylindrical satellite body designed to rotate about its long axis for passive spin stabilisation. Its simple shape and low structural mass suit early technology demonstrators, but the small internal volume limits batteries, instruments and deployable hardware. Explorer 1 is a useful historical reference for this class of compact early spacecraft."},"b_drm":{"d":"A drum-shaped spacecraft bus with equipment arranged around a central structure and solar cells mounted on its exterior. The geometry supports a relatively simple, economical satellite and can provide power without large deployable wings. Because the spacecraft relies on spin stabilisation, instruments and antennas must be designed to tolerate or work around continuous rotation."},"b_mm":{"d":"A general-purpose, three-axis-stabilised spacecraft platform with dedicated mounting locations for power, communications, propulsion and science equipment. Compared with early spinning satellites, it can keep instruments pointed at a target and support more demanding mission operations. Its greater capability comes with added mass, complexity and subsystem integration requirements."},"b_hc":{"d":"A stiff, lightweight spacecraft bus built around aluminium honeycomb panels. The sandwich construction places strong face sheets around a lightweight core, producing high bending stiffness without the mass of a solid metal panel. It provides a practical platform for precision instruments and deep-space systems, although manufacturing, bonding, thermal design and integration are more demanding."},"b_rv":{"d":"A rover body designed to carry surface mobility hardware, instruments, computing, power and thermal-control equipment. A rocker-bogie suspension helps keep multiple wheels in contact with uneven terrain and reduces the need for complex springs. Unlike an orbiter bus, a rover chassis must survive launch and landing loads, support ground operations and accommodate robotic tools; it therefore requires a separate entry, descent and landing system."},"b_tr":{"d":"An open structural truss that supports large instruments or payloads while leaving space for equipment, cable routing and thermal interfaces. Composite members can provide high stiffness for their mass and help isolate sensitive payloads from unwanted structural movement. The design is useful for large or precision spacecraft, but joints, deployment, vibration behaviour and thermal expansion require careful engineering.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission."},"b_sh":{"d":"A spacecraft platform incorporating a large multi-layer sunshield to reduce heat reaching sensitive instruments. The separated layers reflect and radiate solar energy, helping maintain a cold, stable environment for infrared observations. The shield must be deployed in the correct sequence and remain correctly tensioned; its large area makes launch packaging and deployment reliability major design challenges.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission."},"p_zn":{"d":"A primary (non-rechargeable) silver-zinc battery that stores chemical energy and supplies electrical power when solar generation is unavailable or unnecessary. Silver-zinc cells can deliver high power for their mass, which made them attractive for early short-duration spacecraft. Their limited cycle life and finite stored energy make them unsuitable as the sole source for long missions.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission."},"p_si":{"d":"Solar cells mounted directly on the satellite body convert sunlight into electrical energy through the photovoltaic effect. Early silicon cells enabled spacecraft to operate for longer than battery-only satellites, but body-mounted area is limited and output depends on orientation, illumination and cell efficiency. This is a useful representation of the first generation of practical solar-powered satellites."},"p_sw":{"d":"A deployable solar wing increases the area available to convert sunlight into electricity after launch. The panels are stowed during launch and unfolded once the spacecraft is safely in space, supplying power to instruments, communications and rechargeable batteries. Output varies with distance from the Sun, pointing angle, temperature and radiation-related degradation."},"p_ga":{"d":"A high-efficiency triple-junction gallium-arsenide solar array converts a broader portion of the solar spectrum than older single-junction cells. Multiple semiconductor layers improve conversion efficiency, allowing a spacecraft to generate more power from a given panel area. Such arrays are valuable for power-hungry orbiters, although they remain dependent on sunlight and can lose performance through radiation and ageing."},"p_gp":{"d":"A radioisotope thermoelectric generator converts heat from the radioactive decay of plutonium-238 into electricity using thermoelectric couples. It produces steady power without needing sunlight or moving parts, making it valuable for long-duration missions far from the Sun. Output is modest compared with large solar arrays and gradually declines over time; the system also requires specialised handling and substantial safety engineering."},"p_mm":{"d":"A Multi-Mission Radioisotope Thermoelectric Generator uses plutonium-238 decay heat to provide both electrical power and useful waste heat. It is designed to operate in space and on planetary surfaces, which makes it suitable for missions such as Curiosity and Perseverance. Its dependable, sunlight-independent output supports heaters, computers and instruments, but it supplies far less electrical power than a large solar array."},"p_nh":{"d":"A rechargeable nickel-hydrogen battery stores energy generated by the spacecraft's power source and supplies it during eclipses, peak loads or periods when solar arrays cannot point at the Sun. Nickel-hydrogen chemistry was valued for long cycle life and robust performance on long-lived satellites. Its disadvantages include relatively high mass, pressure-vessel complexity and lower energy density than newer lithium-ion systems.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission."},"p_li":{"d":"A rechargeable lithium-ion battery stores electrical energy at comparatively high energy density and can deliver power during eclipse periods and transient loads. Battery-management electronics monitor cell voltage, current and temperature to keep the pack within safe operating limits. Lithium-ion systems reduce mass compared with many older chemistries, but require careful thermal control, charging limits and fault protection.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission."},"r_hy":{"d":"A monopropellant hydrazine propulsion system produces thrust by passing hydrazine through a catalyst bed, where it decomposes into hot gases. Small thruster clusters are commonly used for attitude adjustments, momentum management and modest trajectory corrections. The system is relatively simple and restartable, but its specific impulse is lower than that of many bipropellant or electric systems, and hydrazine is toxic and requires careful handling."},"r_bi":{"d":"A liquid bipropellant engine burns separate fuel and oxidizer streams in a combustion chamber to produce higher thrust and greater efficiency than a typical monopropellant thruster. A hydrazine-family fuel and nitrogen tetroxide oxidizer are hypergolic, meaning they ignite on contact, which simplifies ignition for spacecraft manoeuvres. Tanks, valves, pressurisation and plumbing add mass and operational complexity."},"r_sc":{"d":"A powered descent stage uses throttleable rocket engines to reduce a lander's velocity during the final approach to a planetary surface. It must control altitude, vertical speed and horizontal motion while carrying the lander and its remaining propellant. The stage is normally discarded or flown away after touchdown, so it is single-use hardware; the exact mass and propellant figures in this catalogue are game-balancing values."},"r_ts":{"d":"A small titanium propellant tank stores pressurised spacecraft propellant and feeds it to the propulsion system through regulated lines and valves. Titanium offers a useful combination of strength, corrosion resistance and relatively low mass. Tank sizing must account for pressure, propellant volume, structural margins, plumbing and residual propellant; the catalogue's capacity is a simplified gameplay specification.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission."},"r_tl":{"d":"A larger titanium propellant tank provides greater propellant capacity for missions requiring larger manoeuvres or more frequent thruster operations. The stronger tank structure supports pressurised storage, while regulators and feed lines deliver propellant at the required operating conditions. More capacity can increase mission capability, but the tank and its contents add launch mass and require compatible propulsion hardware.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission."},"a_gy":{"d":"A rate-gyro package measures how quickly the spacecraft rotates about one or more axes. The flight computer integrates these measurements to estimate changes in attitude between other sensor updates and can use them to stabilise the spacecraft. Gyros are valuable for short-term attitude knowledge, but errors accumulate over time, so they are normally combined with star, Sun or other reference sensors."},"a_rw":{"d":"Reaction wheels are electrically driven flywheels that change spacecraft attitude by exchanging angular momentum with the vehicle. By speeding up or slowing down the wheels, a spacecraft can point cameras, antennas and instruments accurately without continuously firing thrusters. Wheel momentum builds up over time and must be unloaded using another torque source, such as thrusters; wheels also introduce mechanical and bearing reliability considerations."},"c_bc":{"d":"A simple radio beacon transmits a repetitive signal that can be detected by ground receivers. Early satellites used beacons to confirm that they had reached orbit and to provide basic tracking information. A beacon is robust and easy to receive, but it carries little or no detailed science data and generally cannot accept commands from Earth.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission."},"c_sb":{"d":"An S-band transponder receives an uplink from Earth and returns a coherent or otherwise controlled downlink for tracking, telemetry and command operations. A transponder supports two-way communication and can help ground stations measure spacecraft range and velocity. Data capacity depends on transmitter power, antenna gain, coding, distance and ground-station capability.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission."},"c_hs":{"d":"A steerable S-band dish concentrates radio energy into a narrower beam than an omnidirectional antenna, improving the link with Earth. The pointing mechanism allows the antenna to track a ground station while the spacecraft maintains a science attitude, depending on the design. Directional antennas improve communication performance but require accurate attitude knowledge and pointing control.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission."},"c_hx":{"d":"A high-gain X-band dish directs a narrow radio beam toward Earth for deep-space telemetry and science-data return. X-band is widely used for interplanetary communications because it supports reliable long-distance links with suitable ground infrastructure. A large dish offers substantial antenna gain, but it is relatively bulky and must be pointed accurately toward the receiving station.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission."},"c_ka":{"d":"An advanced X/Ka-band high-gain antenna supports high-rate communications using higher-frequency radio links. Ka-band can provide greater bandwidth, but links are more sensitive to pointing errors, atmospheric attenuation and weather at the ground station. The system places greater demands on electrical power, radio-frequency hardware, thermal management and precise spacecraft attitude control.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission."},"c_uh":{"d":"A UHF relay radio communicates over short distances with landers or rovers operating on a planetary surface. The surface vehicle sends its stored telemetry to an orbiter during a pass; the orbiter then forwards the data to Earth using its deep-space radio system. This store-and-forward architecture allows small surface vehicles to use less powerful antennas and radios.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission."},"s_gc":{"d":"A Geiger-counter-style cosmic-ray detector registers energetic charged particles through electrical pulses produced in its detector tube. Such instruments can measure particle count rates and reveal changes in the radiation environment around a spacecraft. Early instruments of this class contributed to the discovery and study of Earth's radiation belts, although a basic counter provides limited particle identification and energy information."},"s_tv":{"d":"A television-style imaging camera converts incoming light into an electronic image that can be transmitted to Earth. Early space cameras demonstrated that spacecraft could return pictures of clouds, terrain or other targets from orbit. Compared with modern digital imaging systems, a basic vidicon camera has lower resolution, limited sensitivity and slower image acquisition and transmission."},"s_ms":{"d":"A multispectral scanner records reflected or emitted energy in several wavelength bands. Comparing those bands helps distinguish surface materials, vegetation, water, clouds and other features that may look similar in ordinary photographs. The instrument is valuable for Earth-resources and planetary mapping, but collecting and transmitting multiple bands creates larger data volumes than a simple camera."},"s_mg":{"d":"A fluxgate magnetometer measures the strength and direction of a magnetic field using magnetically sensitive cores and coils. It can map planetary magnetic fields, detect changes in the surrounding plasma environment and investigate interactions with the solar wind. The sensor is often mounted on a boom to move it away from magnetic interference generated by spacecraft electronics, motors and power systems."},"s_is":{"d":"A multi-camera imaging science system combines wide-angle and narrow-angle cameras to observe planets, moons, rings and other targets at different scales. Wide-angle images provide context, while narrow-angle images reveal smaller surface and atmospheric features. The Voyager imaging system is a major historical example; image quality and scientific value depend on optics, filters, pointing, exposure and available data bandwidth."},"s_hi":{"d":"HiRISE is a powerful telescopic visible-light camera designed to image the Martian surface at exceptionally high spatial resolution. Its observations can reveal small landforms, layering, dunes, impact features and potential landing hazards that are invisible in lower-resolution global maps. The high-resolution images generate large data volumes and require careful targeting, pointing and image compression.","m":"Mars Reconnaissance Orbiter."},"s_cx":{"d":"CRISM is a visible-to-near-infrared imaging spectrometer that measures reflected sunlight at many wavelengths to identify minerals on Mars. Different minerals leave characteristic spectral signatures, allowing scientists to map clays, hydrated salts and other materials associated with past water-rock interactions. Spectral mapping requires careful calibration and produces data that must be interpreted alongside geological context.","m":"Mars Reconnaissance Orbiter."},"s_sh":{"d":"SHARAD is a shallow subsurface radar sounder that sends radio pulses toward Mars and records echoes reflected by boundaries beneath the surface. Variations in the returned signal can reveal buried layers, deposits and possible water ice within the upper crust. Radar interpretation depends on material properties and geometry; the instrument complements optical images because it can investigate features hidden below the surface.","m":"Mars Reconnaissance Orbiter."},"s_mc":{"d":"Mastcam is a pair of colour cameras mounted on Curiosity's mast, providing panoramic views, geological context, stereo imaging and video of the Martian environment. Scientists use its images to select targets, document rover traverses and study rocks, layers, dust and atmospheric conditions. Its two-camera arrangement supports depth perception and a range of image scales."},"s_cc":{"d":"ChemCam combines a laser-induced breakdown spectroscopy system with a remote micro-imager. A short laser pulse removes a tiny amount of material from a rock or soil target, creating a plasma whose emitted light reveals elemental composition. This lets Curiosity perform rapid chemical screening from a distance before deciding which targets deserve closer examination."},"s_sa":{"d":"SAM is an onboard analytical laboratory that studies the chemistry of Martian rocks, soil and atmosphere. Its instruments include a mass spectrometer, gas chromatograph and tunable laser spectrometer, which can identify gases and organic compounds released from samples or present in the atmosphere. SAM is scientifically powerful but large, resource-intensive and dependent on careful sample delivery and heating procedures."},"s_ch":{"d":"CheMin uses X-ray diffraction and X-ray fluorescence to identify minerals and estimate their abundances in powdered rock and soil samples. Mineral identification helps reconstruct the conditions under which rocks formed and whether they interacted with liquid water. Samples must be delivered to the instrument's internal analysis cell, so CheMin depends on the rover's drill and sample-handling system."},"s_mw":{"d":"A microwave radiometer measures thermal microwave emissions from a planet at several frequencies. Because different frequencies can emerge from different atmospheric depths, the instrument can probe temperature, composition and the distribution of substances such as water and ammonia beneath visible cloud tops. Juno's MWR uses multiple channels and carefully planned scans to investigate Jupiter's deep atmosphere."},"s_jc":{"d":"JunoCam is a visible-light colour camera designed to provide detailed views of Jupiter's cloud tops and to involve the public in selecting and processing images. Its observations reveal cloud structures, storms and polar features, complementing Juno's more specialised instruments. It is an imaging instrument rather than a full atmospheric spectrometer, and its operations are constrained by Jupiter's intense radiation environment."},"s_oc":{"d":"OCAMS is a suite of cameras designed for optical navigation, mapping and characterisation of an asteroid. Different fields of view support approach imaging, detailed surface mapping and close inspection of selected features. The instrument name is associated with NASA's OSIRIS-REx mission to Bennu, so in this game's catalogue it should be treated as a later-era example or custom-craft technology, not as hardware flown on the five main campaign spacecraft.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission."},"s_ol":{"d":"OLA is a laser altimeter that sends laser pulses toward an asteroid and measures their return times to build a three-dimensional map of the surface. The resulting topography helps determine shape, slopes, boulder distributions and safe operating regions. OLA was developed for OSIRIS-REx and is included here as a later-era technology example rather than a component of the Dawn mission.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission."},"s_ts":{"d":"TAGSAM is the Touch-and-Go Sample Acquisition Mechanism used by OSIRIS-REx to collect material from asteroid Bennu. Its articulated arm places a sampling head against the surface and releases a burst of gas to stir loose regolith into a collection chamber. It is a specialised sample-return system, not a general-purpose science instrument, and it requires proximity operations and a carefully controlled contact sequence.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission."},"s_nc":{"d":"NIRCam is the Near-Infrared Camera developed for the James Webb Space Telescope. It records near-infrared images and supports observations of very distant galaxies, star formation and exoplanet systems. The real instrument operates as part of a cryogenic observatory with specialised optics, detectors and calibration; the component in this game represents advanced infrared telescope technology, not a payload for the five historical campaign missions.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission."},"s_mi":{"d":"MIRI is the Mid-Infrared Instrument on the James Webb Space Telescope. It combines imaging and spectroscopy at mid-infrared wavelengths, allowing astronomers to study cool objects, dust-enshrouded regions and distant galaxies. Its detectors must operate at extremely low temperatures, requiring a dedicated cryogenic system; this makes MIRI a complex, high-mass, later-generation observatory payload.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission."},"s_mr":{"d":"A segmented primary mirror uses multiple precisely shaped mirror sections that are aligned to act as one large optical surface. Segmentation allows a telescope mirror larger than a launch vehicle's fairing to be folded for launch and deployed in space. Each segment needs precise actuators, sensing and calibration; the large mirror area improves light collection but makes deployment and optical alignment exceptionally demanding.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission."},"s_ctx":{"d":"CTX is a broad-context visible-light camera on Mars Reconnaissance Orbiter. It images wide swaths of terrain at moderate resolution so scientists can understand the regional setting of smaller targets observed by HiRISE and CRISM. Its role is complementary: it sacrifices fine detail to provide the geographic context needed to interpret high-resolution images and mineral maps.","m":"Mars Reconnaissance Orbiter."},"s_marci":{"d":"MARCI is a wide-angle camera that repeatedly observes Mars to monitor clouds, dust storms, water-ice clouds and seasonal atmospheric changes. Its broad coverage is suited to daily global weather mapping rather than detailed close-up geology. Repeated observations help scientists track how atmospheric conditions evolve across the planet and through the Martian seasons.","m":"Mars Reconnaissance Orbiter."},"s_mcs":{"d":"The Mars Climate Sounder is a radiometer that observes thermal emission in infrared and visible/near-infrared bands to profile the Martian atmosphere. It measures temperature, dust, water-ice clouds and water vapour at different altitudes, helping scientists understand atmospheric circulation and seasonal climate. Its vertical profiles complement surface weather measurements and wide-angle imaging.","m":"Mars Reconnaissance Orbiter."},"a_star":{"d":"A star tracker is an optical attitude sensor that photographs star fields and matches the observed pattern against an onboard star catalogue. From the known directions of stars, the spacecraft computer estimates its orientation with high precision. Star trackers are important for pointing narrow-beam antennas and science instruments, but they need a suitable field of view and can be affected by bright objects, stray light or contamination.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission."},"a_sun":{"d":"A Sun sensor detects the direction of the Sun and provides a reference for spacecraft orientation. Simple sensors can support safe-mode recovery and help point solar arrays toward the Sun when more precise attitude knowledge is unavailable. They are robust and comparatively simple, but generally provide less precise pointing information than a star tracker.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission."},"d_rec":{"d":"An onboard data recorder stores science measurements, images and engineering telemetry until the spacecraft has a suitable opportunity to transmit them. Memory buffering is essential when a spacecraft is outside ground-station visibility, when the communication link is unavailable, or when instruments generate data faster than the radio can send it. Storage capacity and data-management software determine how much information can be retained before downlink.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission.","m":"Dawn, except where the item is explicitly a generic subsystem."},"d_cdh":{"d":"The command and data-handling unit is the spacecraft's central computing and information-management subsystem. It receives and validates commands, schedules activities, controls instrument operations, gathers telemetry and routes data between onboard systems. Fault detection, redundancy and safe-mode logic are important because a failure in central avionics can affect many spacecraft functions.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission.","m":"Dawn, except where the item is explicitly a generic subsystem."},"t_ctl":{"d":"The thermal-control subsystem keeps spacecraft equipment within its allowable temperature range despite changing sunlight, shadow, internal heat generation and the cold space environment. It may combine insulation, surface coatings, radiators, heat pipes, louvers, heaters and temperature sensors. Thermal design protects batteries, propellant, electronics and instruments; heater power and radiator area create mass and energy trade-offs.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission."},"c_magboom":{"d":"A deployable magnetometer boom places magnetic sensors away from the spacecraft body to reduce interference from electrical currents, motors and magnetised materials. Cassini's magnetometer sensors were mounted on a long boom so measurements better represented Saturn's magnetic environment rather than the orbiter's own fields. The boom must deploy reliably and remain mechanically stable during observations.","m":"Cassini orbiter."},"c_radar":{"d":"Cassini's radar instrument used microwave wavelengths to observe Titan through its dense atmospheric haze, which blocks ordinary visible-light views of much of the surface. It operated in several modes, including synthetic-aperture imaging, altimetry and radiometry, to map terrain and investigate surface properties. It required a high-gain antenna, substantial power and carefully planned spacecraft pointing.","m":"Cassini orbiter."},"c_cirs":{"d":"The Composite Infrared Spectrometer measured infrared radiation from Saturn, its rings and moons. Spectral measurements allowed scientists to estimate temperatures and investigate the composition and distribution of gases and ices. By observing at multiple wavelengths, CIRS helped reveal atmospheric structure, seasonal changes and thermal properties that visible-light images alone cannot show.","m":"Cassini orbiter."},"c_iss":{"d":"Cassini's Imaging Science Subsystem used wide-angle and narrow-angle cameras to capture visible, ultraviolet and near-infrared images of Saturn, its rings and moons. The paired camera system supported both broad contextual views and detailed close-ups during flybys. Its extensive image archive documented changing ring structures, atmospheric storms, surface geology and the diverse landscapes of Saturn's moons.","m":"Cassini orbiter."},"c_uvis":{"d":"The Ultraviolet Imaging Spectrograph measured ultraviolet light from Saturn's atmosphere, rings and moons. It observed emissions and reflected sunlight to study atmospheric composition, auroral activity, ring structure and interactions among particles and gases. UV observations reveal processes that may be difficult to detect at visible or infrared wavelengths.","m":"Cassini orbiter."},"c_vims":{"d":"The Visible and Infrared Mapping Spectrometer collected spectral images across visible and infrared wavelengths. It helped identify surface materials and atmospheric constituents on Saturn's moons, while also studying clouds, rings and thermal features. By measuring how different wavelengths are reflected or emitted, VIMS provided compositional information beyond what a conventional camera can deliver.","m":"Cassini orbiter."},"c_caps":{"d":"The Cassini Plasma Spectrometer measured ions and electrons in the plasma surrounding Saturn and its moons. Its sensors characterised particle populations, energies and directions, helping scientists investigate the magnetosphere and how it interacts with the solar wind, rings and icy moons. It is an in-situ particle instrument, so its observations depend on spacecraft location and orientation.","m":"Cassini orbiter."},"c_cda":{"d":"The Cosmic Dust Analyzer measured tiny dust and ice grains encountered by Cassini. It analysed particle impacts and their electrical or mass-related signatures to investigate the composition and distribution of material in Saturn's rings and surrounding environment. These measurements helped study ring particles, interplanetary dust and material escaping from moons such as Enceladus.","m":"Cassini orbiter."},"c_inms":{"d":"The Ion and Neutral Mass Spectrometer sampled neutral and charged particles near Saturn and Titan and measured their mass-to-charge characteristics. It helped determine the composition of Titan's upper atmosphere and Saturn's magnetospheric environment. The instrument requires carefully planned sampling geometry because the spacecraft must pass through the relevant gas or particle populations.","m":"Cassini orbiter."},"c_mimi":{"d":"The Magnetospheric Imaging Instrument investigated energetic ions, electrons and neutral atoms in Saturn's magnetosphere. Its measurements helped map energetic particle populations and understand how Saturn's magnetic environment responds to the solar wind and interactions with moons and rings. It combined particle detectors and energetic-neutral imaging techniques to provide a broader view of the magnetosphere.","m":"Cassini orbiter."},"c_rpws":{"d":"The Radio and Plasma Wave Science instrument measured radio emissions and plasma waves around Saturn. Antennas and receivers detected natural electromagnetic signals generated by the planet, its magnetosphere, lightning and interactions with moons and rings. These signals reveal plasma density, wave activity and dynamic processes that cannot be observed directly with a camera.","m":"Cassini orbiter."},"c_rss":{"d":"Cassini's Radio Science Subsystem used the spacecraft's radio link as a precision scientific instrument. By tracking changes in the radio signal's frequency, phase and strength during carefully planned geometries, scientists could study gravity fields, atmospheric and ionospheric structure, and the properties of Saturn's rings. The investigation depended on accurate Deep Space Network tracking and precise spacecraft navigation.","m":"Cassini orbiter."},"c_mag":{"d":"A dual-technique magnetometer combines complementary magnetic-field sensors to measure both field strength and direction over a broad range of conditions. Cassini's magnetometer investigation used fluxgate and vector helium sensors mounted on its boom to characterise Saturn's magnetic field and its interaction with the surrounding environment. Magnetic cleanliness and separation from spacecraft electronics are essential for reliable measurements.","m":"Cassini orbiter."},"c_huygens":{"d":"The Huygens probe was an ESA atmospheric entry probe carried to Saturn by NASA's Cassini orbiter and released for a parachute descent through Titan's thick atmosphere. It measured atmospheric structure and composition, imaged the descent and returned data from the surface. Huygens was a one-time probe rather than an orbiter; its data were relayed to Earth through Cassini, so the orbiter had to remain correctly positioned and configured during the descent.","m":"Cassini-Huygens / Huygens probe system."},"c_hasi":{"d":"HASI measured Titan's atmospheric physical properties during Huygens' descent, including acceleration, pressure, temperature and electrical properties. These measurements helped reconstruct the atmosphere's structure and the probe's descent conditions from high altitude to the surface. Its data are tied to the short entry-and-descent phase and are not a continuously operating orbiter experiment.","m":"Cassini-Huygens / Huygens probe system."},"c_gc_ms":{"d":"The Gas Chromatograph and Mass Spectrometer analysed Titan's atmospheric gases and collected samples during Huygens' descent. The gas chromatograph separated chemical constituents, while the mass spectrometer helped identify them by their mass-to-charge signatures. Together, they provided direct measurements of Titan's atmospheric composition and helped investigate its complex organic chemistry.","m":"Cassini-Huygens / Huygens probe system."},"c_acp":{"d":"The Aerosol Collector and Pyrolyser collected haze particles from Titan's atmosphere and heated them to release material for chemical analysis by the onboard mass spectrometer. This allowed Huygens to investigate the composition of Titan's atmospheric aerosols, which contribute to its thick orange haze. The process consumed or altered collected samples and operated only during the probe's descent.","m":"Cassini-Huygens / Huygens probe system."},"c_disr":{"d":"The Descent Imager/Spectral Radiometer combined cameras and spectral sensors to observe Titan during Huygens' parachute descent. It recorded images of the landscape as visibility improved and measured sunlight and reflected radiation to investigate the atmosphere and surface. Its observations helped reveal drainage-like channels and a landing region of rounded icy material.","m":"Cassini-Huygens / Huygens probe system."},"c_dwe":{"d":"The Doppler Wind Experiment used shifts in the frequency of Huygens' radio signal, measured by Earth-based receivers, to infer the probe's motion and Titan's winds during descent. This required a stable radio link between the probe, Cassini and ground stations. It provided wind information that would be difficult to obtain from images alone.","m":"Cassini-Huygens / Huygens probe system."},"c_ssp":{"d":"The Surface Science Package was a collection of sensors designed to characterise Titan's surface or the material encountered at landing. Depending on the sensor, it could measure properties such as density, thermal behaviour, acoustic response and mechanical interaction. Its value depended on Huygens reaching the surface and operating long enough to return measurements.","m":"Cassini-Huygens / Huygens probe system."},"c_probe_support":{"d":"The orbiter-side probe support equipment provides the electrical, command, timing and communications interfaces needed to carry and release an atmospheric probe. During descent, Cassini's receiver recorded Huygens' science and engineering telemetry and stored it for later transmission to Earth. Correct integration and pointing were mission-critical because the probe could not communicate directly with Earth over the required link.","m":"Cassini-Huygens / Huygens probe system."},"msl_apxs":{"d":"APXS is a contact instrument mounted on Curiosity's robotic arm. It irradiates a rock or soil target with alpha particles and X-rays and measures the characteristic X-rays emitted by elements in the sample. The resulting elemental composition helps scientists compare rocks, identify alteration and understand the chemistry of Gale Crater; the sensor must be positioned close to the target for useful measurements.","m":"Mars Science Laboratory / Curiosity."},"msl_dan":{"d":"DAN uses neutron measurements to detect hydrogen in the ground beneath and around Curiosity. Hydrogen can indicate the presence of water or hydrated minerals, so DAN helps investigate subsurface water-bearing materials that are not visible at the surface. It can operate in passive mode and use an active neutron generator for additional measurements.","m":"Mars Science Laboratory / Curiosity."},"msl_mardi":{"d":"MARDI is a downward-looking colour camera that recorded images of the terrain during Curiosity's descent to the surface. The sequence provided a geological view of the landing site and helped connect orbital maps with the rover's actual surroundings. Its primary science opportunity occurred during the short landing phase rather than during routine surface operations.","m":"Mars Science Laboratory / Curiosity."},"msl_mahli":{"d":"MAHLI is a colour close-up camera mounted on Curiosity's robotic arm turret. It images the textures, grains, layers and structures of rocks and soil at hand-lens scale, helping scientists choose samples and interpret geological processes. The arm positions the camera near a target, and built-in lighting supports imaging in shadow or low-light conditions.","m":"Mars Science Laboratory / Curiosity."},"msl_rad":{"d":"RAD measures energetic particles and radiation at the Martian surface. It detects several components of the radiation environment, including charged particles, neutrons and gamma rays, helping scientists understand both the planet's atmosphere and the radiation exposure future human explorers could experience. It provides long-term environmental measurements rather than close-up geological images.","m":"Mars Science Laboratory / Curiosity."},"msl_rems":{"d":"REMS is a suite of environmental sensors that records Martian weather and ultraviolet conditions. Its measurements include air and ground temperature, pressure, humidity, wind and UV radiation, building daily and seasonal records of the surface environment. Sensor placement and exposure matter because the rover body can disturb local airflow and temperature readings.","m":"Mars Science Laboratory / Curiosity."},"msl_arm":{"d":"Curiosity's robotic arm positions contact instruments and sample-acquisition hardware against selected rocks and soil targets. It provides controlled reach and orientation so APXS and MAHLI can examine surfaces, while the turret carries tools such as the drill and sample-processing equipment. The arm expands the rover's science capability but adds mass, joints, motors, cabling and operational constraints.","m":"Mars Science Laboratory / Curiosity."},"msl_drill":{"d":"Curiosity's sample-acquisition drill uses a percussive rotary mechanism to penetrate rock and produce powdered material for onboard analysis. The sample is transferred through the rover's handling system to instruments such as CheMin and SAM. Drilling enables scientists to examine material protected below the weathered surface, but consumes time and energy and introduces mechanical wear and contamination-control challenges.","m":"Mars Science Laboratory / Curiosity."},"msl_scoop":{"d":"The scoop and sample-handling system collects loose soil or processed rock powder and delivers measured portions to the rover's analytical instruments. Sieves and sample-processing mechanisms help control grain size and reduce the risk of clogging or overfilling. The system is essential for feeding the internal laboratory but must handle varied materials and avoid cross-contamination between samples.","m":"Mars Science Laboratory / Curiosity."},"msl_wheels":{"d":"Curiosity's six-wheel mobility system uses a rocker-bogie suspension to traverse uneven Martian terrain while keeping the rover relatively stable. Each wheel is driven and steered through the mobility system, allowing the rover to climb over obstacles and position itself for science observations. Sharp rocks can damage the wheels, while slopes, loose soil and terrain hazards constrain route planning.","m":"Mars Science Laboratory / Curiosity."},"msl_edl_heatshield":{"d":"The entry heat shield is part of the aeroshell that protects the rover during high-speed atmospheric entry at Mars. Its ablative thermal-protection material absorbs and carries away intense heat generated by atmospheric friction and compression. The shield is jettisoned after the vehicle has slowed sufficiently, so it is single-use hardware and its mass directly affects the landing system.","m":"Mars Science Laboratory / Curiosity."},"msl_edl_backshell":{"d":"The backshell encloses and protects the rover during cruise and entry, and it carries the parachute used to slow the vehicle in the Martian atmosphere. The parachute must deploy at the correct dynamic pressure and survive supersonic loads. It is discarded during descent after its work is complete; its performance must be integrated with the heat shield, radar, descent stage and guidance system.","m":"Mars Science Laboratory / Curiosity."},"msl_edl_skycrane":{"d":"The powered-descent sky-crane stage uses rocket engines to slow and guide Curiosity during the final descent, then lowers the rover on bridles to the surface. Once touchdown is detected, the bridles are cut and the descent stage flies away to avoid striking the rover. The system enabled delivery of a heavy rover but required precise navigation, engine control, timing and a tightly choreographed sequence.","m":"Mars Science Laboratory / Curiosity."},"msl_uhf":{"d":"The rover's UHF relay radio sends stored data and receives selected commands through orbiters passing overhead. Relaying through Mars orbiters provides a more efficient route to Earth than requiring the rover to maintain a high-power direct-to-Earth link for every transmission. The system depends on compatible relay spacecraft, scheduled passes, antenna visibility and onboard data buffering.","m":"Mars Science Laboratory / Curiosity."},"j_mwr":{"d":"Juno's Microwave Radiometer observes Jupiter's thermal microwave emission at multiple frequencies to probe beneath the visible cloud tops. Different channels sense different atmospheric depths, allowing scientists to investigate temperature structure and the distribution of water and ammonia. The measurements help reveal how deep Jupiter's weather systems extend and how the planet's atmosphere is organised.","m":"Juno."},"j_jiram":{"d":"JIRAM combines an infrared imager and spectrometer to study Jupiter's auroras and atmospheric composition. It observes infrared emissions from gases and particles, including features associated with the planet's polar regions. Its measurements complement ultraviolet and particle instruments by revealing thermal and chemical signatures in the upper atmosphere.","m":"Juno."},"j_mag":{"d":"Juno's Magnetometer Investigation measures the strength and direction of Jupiter's magnetic field using sensors mounted on a boom to reduce interference from the spacecraft. The measurements help map the planet's internal magnetic field, investigate its complex structure and understand how the magnetosphere interacts with charged particles. Magnetic cleanliness and accurate knowledge of sensor orientation are essential.","m":"Juno."},"j_jade":{"d":"JADE measures low-energy electrons and ions in Jupiter's magnetosphere, including particles associated with the planet's powerful auroras. It determines particle energies, directions and composition to help explain how charged particles move and interact with Jupiter's magnetic field. The instrument is sensitive to spacecraft charging and the geometry of the spacecraft's passage through the particle environment.","m":"Juno."},"j_jedi":{"d":"JEDI measures energetic ions and electrons in Jupiter's radiation belts and magnetosphere. By determining particle energy and direction, it helps scientists understand how particles are accelerated, transported and lost in Jupiter's powerful magnetic environment. The detectors must operate in a harsh radiation region and distinguish particle populations across a broad range of conditions.","m":"Juno."},"j_waves":{"d":"Juno's Waves instrument detects radio and plasma waves generated in Jupiter's magnetosphere. Its measurements help determine plasma properties and investigate interactions among the magnetic field, charged particles and auroral processes. Antenna placement and electromagnetic cleanliness matter because spacecraft electronics can create interference that masks weak natural signals.","m":"Juno."},"j_uvs":{"d":"The Ultraviolet Imaging Spectrograph observes ultraviolet emissions from Jupiter's auroras and upper atmosphere. By separating light into wavelengths, it helps identify emitting species and map where auroral processes occur. UVS complements JIRAM's infrared observations and particle instruments, giving scientists a more complete picture of energy flow in Jupiter's polar environment.","m":"Juno."},"j_sru":{"d":"Juno's Stellar Reference Unit is a radiation-hardened star camera used primarily for spacecraft attitude knowledge and, in some observations, faint-light imaging. It identifies star patterns to determine orientation, supporting precise pointing and navigation in Jupiter's intense radiation environment. Its radiation tolerance is particularly important for long operations close to the planet.","m":"Juno."},"j_radiation_vault":{"d":"Juno's titanium radiation vault encloses sensitive spacecraft electronics to reduce their exposure to Jupiter's intense trapped radiation. Shielding does not eliminate radiation, but it helps extend the life of computers and other vulnerable components. The vault adds mass and must be designed around thermal dissipation, cable penetrations and access for integration.","a":"Generic subsystem class or later-era reference; retain the game's historical unlock restrictions and do not present this as hardware flown on every campaign mission.","m":"Juno."},"d_fc":{"d":"Dawn's Framing Camera captured images of Vesta and Ceres through clear and colour filters. The images supported global mapping, geological interpretation, shape reconstruction and optical navigation, while filter measurements provided clues about surface composition. Dawn carried redundant camera units to improve reliability during its long mission.","m":"Dawn, except where the item is explicitly a generic subsystem."},"d_vir":{"d":"The Visible and Infrared Spectrometer measured reflected sunlight and thermal emission across visible and infrared wavelengths to map the surface composition of Vesta and Ceres. Spectral signatures helped identify minerals and hydrated materials and compare the geological histories of the two bodies. VIR required careful calibration, pointing and thermal management to obtain reliable spectral maps.","m":"Dawn, except where the item is explicitly a generic subsystem."},"d_grand":{"d":"GRaND measures gamma rays and neutrons emitted or scattered by cosmic-ray interactions with an asteroid's surface. These signals reveal the abundance of elements such as iron, silicon, oxygen, hydrogen and other constituents in the upper surface layer. Its measurements helped investigate Vesta's composition and the water-bearing materials associated with Ceres.","m":"Dawn, except where the item is explicitly a generic subsystem."},"d_ion":{"d":"The NSTAR ion propulsion system accelerates xenon ions using electrical power and expels them at high speed to produce a small but highly efficient thrust. Dawn used three ion engines, operating one at a time, with two required over the mission and one serving as a spare. The low thrust must be applied for long periods, but the high propellant efficiency enabled Dawn to orbit both Vesta and Ceres.","m":"Dawn, except where the item is explicitly a generic subsystem."},"d_xenon":{"d":"The xenon tank and feed system stores the inert xenon propellant and supplies it at controlled flow to the ion propulsion system. Xenon is ionised inside the thruster and accelerated by electric fields to generate thrust. Tank capacity, pressure regulation, valves and feed hardware determine how much total impulse the spacecraft can deliver before its propellant is exhausted.","m":"Dawn, except where the item is explicitly a generic subsystem."},"d_solar":{"d":"Dawn's two large deployable solar-array wings supplied electrical power for the spacecraft, including its ion engines and science instruments. Their large photovoltaic area was essential because sunlight is much weaker in the asteroid belt than near Earth. The arrays could be oriented toward the Sun, and available power decreased as Dawn travelled farther from the Sun, requiring careful power and thrust planning.","m":"Dawn, except where the item is explicitly a generic subsystem."},"d_hga":{"d":"Dawn's high-gain antenna provided the principal high-rate X-band link for commands and science-data return over interplanetary distances. Its narrow radio beam improved link performance but required the spacecraft to point the dish accurately toward Earth. During some operations, Dawn had to interrupt thrusting or adjust attitude to maintain communications.","m":"Dawn, except where the item is explicitly a generic subsystem."},"d_star":{"d":"Dawn's star tracker measured spacecraft orientation by imaging known star fields. Its attitude-control system used star tracker data together with inertial and Sun-sensor information to determine pointing for science observations, antenna communication and solar-array alignment. Star trackers provide accurate references but need clear views of stars and careful calibration.","m":"Dawn, except where the item is explicitly a generic subsystem."},"d_ion_pdu":{"d":"The ion propulsion power-processing unit converts and regulates spacecraft electrical power into the high-voltage and controlled electrical supplies required by the ion thrusters. It manages the power delivered to discharge, beam and other thruster subsystems and supports safe start-up and shutdown. The unit is essential to electric propulsion but must handle high electrical loads, heat dissipation and fault protection.","m":"Dawn, except where the item is explicitly a generic subsystem."}};

// ORBITAL ENGINEER - Technology Tree. Horizontal: older tech on the left, newer on the right. One lane per category.
const $ = s => document.querySelector(s);
const C = window.TECH_TREE_DATA.components;
const LANES = [['Structure','#ff8f4a'],['Power','#ffd23f'],['Propulsion','#e0524a'],['Navigation & Control','#7fe0a8'],['Science Payload','#3fd0f0'],['Communications','#a77bf0'],
  ['Data & Thermal','#8dd3d2'],['Probe / Landing','#f28ab8'],['Entry & Landing','#f2b441'],['Mobility','#b4d65a'],['Robotics','#9fb4ff']];
const G = { w: 11.4, h: 6.6, px: 12.6, py: 7.6, gap: 2.4, pad: 1, x0: 1.2, maxRows: 4 };
const money = m => m == null ? '—' : m >= 1 ? '$' + +m.toFixed(1) + 'M' : '$' + Math.round(m * 1000) + 'k';
const val = (v, u) => v == null || v === '' ? '—' : v + (u ? ' ' + u : '');

// ---------- layout ----------
const years = [...new Set(C.map(c => c.available_from_year))].sort((a, b) => a - b);
const lanes = LANES.map(([cat, color]) => ({ cat, color, items: C.filter(c => c.category === cat).sort((a, b) => a.available_from_year - b.available_from_year || a.name.localeCompare(b.name)) })).filter(l => l.items.length);
lanes.forEach(l => { const n = {}; l.items.forEach(c => n[c.available_from_year] = (n[c.available_from_year] || 0) + 1); l.rows = Math.min(G.maxRows, Math.max(...Object.values(n))); l.h = l.rows * G.py + 2 * G.pad; });
const subs = Object.fromEntries(years.map(y => [y, 1]));
lanes.forEach(l => { const n = {}; l.items.forEach(c => n[c.available_from_year] = (n[c.available_from_year] || 0) + 1); for (const y in n) subs[y] = Math.max(subs[y], Math.ceil(n[y] / l.rows)); });
const xs = {}; let X = G.x0; years.forEach(y => { xs[y] = X; X += subs[y] * G.px + G.gap; });
const W = X, H = lanes.reduce((a, l) => a + l.h, 0);
let laneY = 0; const pos = {};
lanes.forEach(l => { l.top = laneY; const k = {}; l.items.forEach(c => { const y = c.available_from_year, i = k[y] = (k[y] || 0) + 1, j = i - 1;
  pos[c.id] = { x: xs[y] + Math.floor(j / l.rows) * G.px, y: laneY + G.pad + (j % l.rows) * G.py, lane: l, row: j % l.rows, year: y }; }); laneY += l.h; });

// ---------- draw ----------
const U = v => `calc(var(--u) * ${v})`;
let svg = `<svg width="${U(W)}" height="${U(H)}" viewBox="0 0 ${W} ${H}" style="width:${U(W)};height:${U(H)}">`;
lanes.forEach(l => { svg += `<rect x="0" y="${l.top}" width="${W}" height="${l.h}" fill="${l.color}" fill-opacity=".3"/><line x1="0" y1="${l.top + l.h}" x2="${W}" y2="${l.top + l.h}" stroke="${l.color}" stroke-opacity=".55" stroke-width=".2"/>`; });
years.forEach(y => { svg += `<line class="vline" x1="${xs[y] - G.gap / 2}" y1="0" x2="${xs[y] - G.gap / 2}" y2="${H}"/>`; });
lanes.forEach(l => { const by = {}; l.items.forEach(c => (by[c.available_from_year] = by[c.available_from_year] || []).push(c));
  const ys = Object.keys(by).map(Number).sort((a, b) => a - b);
  ys.forEach((y, yi) => { if (!yi) return; const prev = by[ys[yi - 1]];
    by[y].forEach(c => { const a = prev.find(p => pos[p.id].row === pos[c.id].row) || prev[prev.length - 1], pa = pos[a.id], pb = pos[c.id];
      const x1 = pa.x + G.w, y1 = pa.y + G.h / 2, x2 = pb.x, y2 = pb.y + G.h / 2, mx = Math.max(x1 + 0.6, Math.min(x2 - 0.6, xs[y] - G.gap / 2));
      svg += `<path class="con" style="stroke:${l.color}" d="M${x1} ${y1} H${mx} V${y2} H${x2}"/>`; }); }); });
svg += '</svg>';
const stat = c => `${c.mass_kg == null ? '—' : c.mass_kg + ' kg'} · ${c.power_generation_w ? '+' + c.power_generation_w : c.power_consumption_w ? '-' + c.power_consumption_w : '0'} W`;
const nodes = C.map(c => { const p = pos[c.id]; return `<button class="node" data-id="${c.id}" style="left:${U(p.x)};top:${U(p.y)};--c:${p.lane.color}"><i>${c.available_from_year}</i><b>${c.name}</b><small>${stat(c)}</small></button>`; }).join('');
$('#canvas').style.width = U(W); $('#canvas').style.height = U(H);
$('#canvas').innerHTML = svg + nodes;
$('#rulerIn').style.width = U(W); $('#rulerIn').innerHTML = '<div class="zw">' + years.map(y => `<span class="yr" style="left:${U(xs[y] - G.gap / 2)}">${y}</span>`).join('') + '</div>';
$('#labelsIn').style.height = U(H); $('#labelsIn').innerHTML = '<div class="zw">' + lanes.map(l => `<div class="lab" style="top:${U(l.top)};height:${U(l.h)};--c:${l.color}">${l.cat}<small>${l.items.length} components</small></div>`).join('') + '</div>';
$('#cat').innerHTML += lanes.map(l => `<option>${l.cat}</option>`).join('');

// ---------- details ----------
const BYID = Object.fromEntries(C.map(c => [c.id, c]));
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// The expanded text is keyed by the clean ID (the Juno JADE ID in the data contains a hidden soft-hyphen character).
const about = c => { const e = (window.EXPANDED || {})[c.id.replace(/[\u00ad\u200b]/g, '')]; if (!e) return '';
  return `<section class="about"><h4>About this component</h4><p>${esc(e.d)}</p>${e.m ? `<p class="meta"><b>Mission</b> ${esc(e.m)}</p>` : ''}${e.a ? '<p class="meta"><b>Note</b> Generic component class or later-era reference, not necessarily hardware flown on any campaign spacecraft.</p>' : ''}</section>`; };
function show(id) {
  const c = BYID[id], col = pos[id].lane.color; document.querySelectorAll('.node.on').forEach(n => n.classList.remove('on')); document.querySelector(`.node[data-id="${id}"]`).classList.add('on');
  $('#detail').innerHTML = `<h3>${c.name}</h3><div class="tags" style="--c:${col}"><span class="tag">${c.category}</span><span class="tag yr2">Available ${c.available_from_year}</span></div><p>${c.description || ''}</p>${about(c)}
  <div class="stats"><div class="stat"><b>Mass</b>${val(c.mass_kg, 'kg')}</div><div class="stat"><b>Cost (est.)</b>${money(c.estimated_cost_usd_millions)}</div>
  <div class="stat"><b>Power use</b>${val(c.power_consumption_w, 'W')}</div><div class="stat"><b>Power generated</b>${val(c.power_generation_w, 'W')}</div>
  <div class="stat"><b>Reliability</b>${val(c.reliability)}</div><div class="stat"><b>Extra metric</b>${val(c.extra_gameplay_metric)}</div></div>
  <dl><dt>Developer</dt><dd>${val(c.manufacturer)}</dd><dt>Advantage</dt><dd>${val(c.gameplay_advantage)}</dd><dt>Trade-off</dt><dd>${val(c.gameplay_tradeoff)}</dd></dl>
  <p class="note">Costs, masses, power and reliability are the catalogue's simplified gameplay estimates, not verified historical figures. Dashes mean the catalogue gave no value.</p>`;
  $('#detail').scrollTop = 0;
}
$('#detail').innerHTML = '<p class="note">Select a component in the tree to see its details.</p>';
$('#canvas').addEventListener('click', e => { const n = e.target.closest('.node'); if (n && !moved) show(n.dataset.id); });

// ---------- filters, scroll sync, drag-to-pan ----------
function filter() { const q = $('#search').value.trim().toLowerCase(), cat = $('#cat').value; let n = 0;
  document.querySelectorAll('.node').forEach(el => { const c = BYID[el.dataset.id], hit = (!cat || c.category === cat) && (!q || (c.name + ' ' + (c.description || '') + ' ' + (c.manufacturer || '')).toLowerCase().includes(q)); el.classList.toggle('dim', !hit); if (hit) n++; });
  $('#count').textContent = n + ' / ' + C.length + ' parts'; }
$('#search').addEventListener('input', filter); $('#cat').addEventListener('change', filter); filter();
const sc = $('#scroller');
sc.addEventListener('scroll', () => { $('#rulerIn').style.transform = `translateX(${-sc.scrollLeft}px)`; $('#labelsIn').style.transform = `translateY(${-sc.scrollTop}px)`; });
let drag = null, moved = false;
sc.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, l: sc.scrollLeft, t: sc.scrollTop }; moved = false; });
window.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 5) { moved = true; sc.classList.add('drag'); } if (moved) { sc.scrollLeft = drag.l - dx; sc.scrollTop = drag.t - dy; } });
window.addEventListener('pointerup', () => { drag = null; sc.classList.remove('drag'); setTimeout(() => { moved = false; }, 0); });

// ---------- zoom ----------
let Z = 1; const treeEl = document.querySelector('.tree');
function setZoom(z, cx, cy) {
  z = Math.max(0.35, Math.min(2.2, z)); if (Math.abs(z - Z) < 0.001) return;
  const r = z / Z, x = cx == null ? sc.clientWidth / 2 : cx, y = cy == null ? sc.clientHeight / 2 : cy, nl = (sc.scrollLeft + x) * r - x, nt = (sc.scrollTop + y) * r - y;
  Z = z; treeEl.style.setProperty('--z', Z); sc.scrollLeft = nl; sc.scrollTop = nt; $('#zVal').textContent = Math.round(Z * 100) + '%';
  $('#rulerIn').style.transform = `translateX(${-sc.scrollLeft}px)`; $('#labelsIn').style.transform = `translateY(${-sc.scrollTop}px)`;
}
$('#zIn').addEventListener('click', () => setZoom(Z * 1.25)); $('#zOut').addEventListener('click', () => setZoom(Z / 1.25)); $('#zVal').addEventListener('click', () => setZoom(1));
sc.addEventListener('wheel', e => { if (!(e.ctrlKey || e.metaKey)) return; e.preventDefault(); const b = sc.getBoundingClientRect(); setZoom(Z * Math.exp(-Math.max(-30, Math.min(30, e.deltaY)) * 0.01), e.clientX - b.left, e.clientY - b.top); }, { passive: false });
$('#backBtn').addEventListener('click', e => { if (document.referrer && history.length > 1) { e.preventDefault(); history.back(); } });

</script>
</body>
</html>
